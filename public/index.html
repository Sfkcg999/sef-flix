<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SEF-FLIX</title>
<style>
body{margin:0;background:#141414;color:#fff;font-family:Helvetica,Arial,sans-serif}
header{position:fixed;top:0;width:100%;z-index:10;display:flex;align-items:center;gap:20px;padding:14px 4%;box-sizing:border-box;background:rgba(20,20,20,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #2a2a2a;box-shadow:0 2px 12px #000a}
header h1{color:#e50914;margin:0;font-size:28px;letter-spacing:2px}header input{margin-left:auto;background:#000a;border:1px solid #fff6;color:#fff;padding:7px 10px;width:220px}
#hero{height:70vh;background-size:cover;background-position:center top;position:relative}
#hero .in{position:absolute;bottom:18%;left:4%;max-width:560px}#hero h2{font-size:46px;margin:0 0 10px}#hero p{text-shadow:0 1px 3px #000;line-height:1.4}
#hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#000c,#0000 60%),linear-gradient(#0000 70%,#141414);pointer-events:none}#hero .in{z-index:2}
.btn{background:#fff;color:#000;border:0;padding:9px 22px;font-weight:bold;border-radius:4px;cursor:pointer;margin-right:8px}.btn.g{background:#6d6d6eb3;color:#fff}
.row{margin:0 4% 26px}.row h3{margin:6px 0}.sc{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.sc::-webkit-scrollbar{display:none}
.card{flex:0 0 150px;height:225px;border-radius:4px;background:#222 center/cover;cursor:pointer;transition:.2s;position:relative}.card:hover{transform:scale(1.08);z-index:2}
.lib{flex:0 0 260px;background:#222;border-radius:4px;padding:10px;font-size:13px;cursor:pointer}.lib small{color:#aaa}
#modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;overflow:auto}#modal .box{max-width:900px;margin:40px auto;background:#181818;border-radius:8px;overflow:hidden}
.bd{height:340px;background:center/cover;position:relative}.bd:after{content:'';position:absolute;inset:0;background:linear-gradient(#0000 50%,#181818)}
.ct{padding:0 30px 30px}.x{float:right;cursor:pointer;font-size:28px;margin:10px 16px;position:relative;z-index:3}
.meta span{margin-right:12px;color:#46d369}.srv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #333;font-size:13px}
.tag{padding:2px 6px;border-radius:3px;background:#333;margin-right:5px}.ok{background:#1d7a2d}select{background:#333;color:#fff;padding:6px;border:0;margin:4px}
.eps{display:flex;flex-wrap:wrap;gap:6px}.ep{background:#2a2a2a;padding:6px 10px;border-radius:3px;cursor:pointer;font-size:13px}.ep.on{background:#e50914}
video{width:100%;background:#000;max-height:70vh}
</style></head><body>
<header><h1>SEF-FLIX</h1><a onclick="home()" style="cursor:pointer">Home</a><input id=q placeholder="Search movies & shows" onkeydown="if(event.key=='Enter')search(this.value)"></header>
<div id=hero></div><div id=rows></div>
<div id=modal onclick="if(event.target==this)closeM()"><div class=box id=mbox></div></div>
<script>
const $=s=>document.querySelector(s),api=u=>fetch(u).then(r=>r.json());
const gb=b=>b>1e9?(b/1e9).toFixed(2)+' GB':(b/1e6|0)+' MB';
const ROWS=[['Trending Movies','movie','top'],['Trending Shows','series','top'],['Popular Movies','movie','imdbRating'],['Top Rated Shows','series','imdbRating'],
['Action','movie','top','Action'],['Comedy','movie','top','Comedy'],['Horror','movie','top','Horror'],['Sci-Fi','movie','top','Sci-Fi'],['Drama Series','series','top','Drama'],['Animation','movie','top','Animation'],['Crime Series','series','top','Crime']];
function card(m){const d=document.createElement('div');d.className='card';d.style.backgroundImage=`url(${m.poster})`;d.title=m.name;d.onclick=()=>openT(m.type,m.imdb_id||m.id);return d}
function row(t,items){const r=document.createElement('div');r.className='row';r.innerHTML=`<h3>${t}</h3><div class=sc></div>`;items.forEach(i=>r.lastChild.append(i));$('#rows').append(r);return r}
async function home(){$('#rows').innerHTML='';$('#hero').style.display='';
 const lib=row('My TorBox Library',[]);api('/api/library').then(d=>d.items.forEach(t=>{const e=document.createElement('div');e.className='lib';
  e.innerHTML=`<b>${t.name}</b><br><small>${gb(t.size)} · ${t.state} · ${t.files.length} video file(s)</small>`;e.onclick=()=>libOpen(t);lib.lastChild.append(e)}));
 for(const [t,ty,id,g] of ROWS){const d=await api(`/api/catalog?type=${ty}&id=${id}${g?'&genre='+g:''}`);const ms=(d.metas||[]).filter(m=>m.poster);
  if(t=='Trending Movies')setHero(ms[0]);row(t,ms.map(card));}}
function setHero(m){$('#hero').style.backgroundImage=`url(${m.background||m.poster})`;
 $('#hero').innerHTML=`<div class=in><h2>${m.name}</h2><p>${(m.description||'').slice(0,250)}</p><button class=btn onclick="openT('${m.type}','${m.imdb_id||m.id}')">▶ Play</button><button class="btn g" onclick="openT('${m.type}','${m.imdb_id||m.id}')">ⓘ More Info</button></div>`}
async function search(q){const d=await api('/api/search?q='+encodeURIComponent(q));$('#rows').innerHTML='';$('#hero').style.display='none';$('#rows').style.paddingTop='70px';
 row('Movies: '+q,d.movie.filter(m=>m.poster).map(card));row('Shows: '+q,d.series.filter(m=>m.poster).map(card))}
function closeM(){$('#modal').style.display='none';$('#mbox').innerHTML=''}
let cur;
async function openT(type,id){$('#modal').style.display='block';$('#mbox').innerHTML='<div class=ct style="padding:30px">Loading…</div>';
 const m=(await api(`/api/meta?type=${type}&id=${id}`)).meta;cur=m;
 $('#mbox').innerHTML=`<div class=bd style="background-image:url(${m.background||m.poster})"><span class=x onclick=closeM()>✕</span></div><div class=ct>
 <h2>${m.name}</h2><div class=meta><span>★ ${m.imdbRating||'–'}</span>${m.releaseInfo||m.year||''} · ${m.runtime||''} · ${(m.genres||m.genre||[]).join(', ')}</div>
 <p>${m.description||''}</p><p style="color:#aaa;font-size:13px">Cast: ${(m.cast||[]).slice(0,6).join(', ')}</p><div id=player></div><div id=eps></div><h3 id=sh>Servers</h3><div id=srv></div></div>`;
 if(type=='series'){const ss=[...new Set((m.videos||[]).map(v=>v.season))].filter(s=>s>0).sort((a,b)=>a-b);
  $('#eps').innerHTML=`<select id=season onchange=showEps()>${ss.map(s=>`<option>${s}</option>`)}</select><div class=eps id=eplist></div>`;showEps();}
 else loadSrv(type,id)}
function showEps(){const s=+$('#season').value;const eps=cur.videos.filter(v=>v.season==s).sort((a,b)=>a.episode-b.episode);
 $('#eplist').innerHTML='';eps.forEach(v=>{const e=document.createElement('div');e.className='ep';e.textContent=`E${v.episode} ${v.name||v.title||''}`;
  e.onclick=()=>{document.querySelectorAll('.ep').forEach(x=>x.classList.remove('on'));e.classList.add('on');loadSrv('series',cur.id,s,v.episode)};$('#eplist').append(e)});
 $('#srv').innerHTML='<p style=color:#aaa>Pick an episode to see servers.</p>'}
async function loadSrv(type,id,s,e){$('#srv').innerHTML='Searching TorBox…';$('#sh').textContent='Servers'+(s?` – S${s}E${e}`:'');
 const d=await api(`/api/streams?type=${type}&id=${id}${s?`&s=${s}&e=${e}`:''}`);if(d.error)return $('#srv').innerHTML=d.error;
 if(!d.streams.length)return $('#srv').innerHTML='No servers found.';
 $('#srv').innerHTML='';d.streams.slice(0,60).forEach(x=>{const r=document.createElement('div');r.className='srv';
  r.innerHTML=`<div><span class="tag ${x.cached?'ok':''}">${x.cached?'⚡ Cached':'Not cached'}</span><span class=tag>${x.quality}</span><span class=tag>${gb(x.size)}</span>${x.seeders?`<span class=tag>👤 ${x.seeders}</span>`:''}<br><small>${x.title}</small></div>`;
  const b=document.createElement('button');b.className='btn';b.textContent=x.cached?'▶ Play':'+ Add to TorBox';b.onclick=()=>play(x,s,e,b);r.append(b);$('#srv').append(r)})}
async function play(x,s,e,b){b.textContent='…';const d=await api(`/api/play?hash=${x.hash}${s?`&s=${s}&e=${e}`:''}${x.file?'&file='+encodeURIComponent(x.file):''}`);
 if(d.status!='ok'){b.textContent=d.status||'error';alert(d.detail||d.error);return}b.textContent='▶ Play';showPlayer(d.url,d.name)}
function showPlayer(url,name){$('#player').innerHTML=`<video controls autoplay src="${url}"></video><p style=font-size:13px>${name} · <a style=color:#46d369 href="${url}" target=_blank>Open/download link</a> · <a style=color:#46d369 href="vlc://${url}">Open in VLC</a> <small style=color:#aaa>(MKV/HEVC/DTS may not play in-browser — use VLC)</small></p>`;$('#player').scrollIntoView()}
async function libOpen(t){$('#modal').style.display='block';$('#mbox').innerHTML=`<div class=ct style="padding:20px"><span class=x onclick=closeM()>✕</span><h2>${t.name}</h2><div id=player></div><div id=srv></div></div>`;
 t.files.forEach(f=>{const r=document.createElement('div');r.className='srv';r.innerHTML=`<div>${f.name}<br><small>${gb(f.size)}</small></div>`;const b=document.createElement('button');b.className='btn';b.textContent='▶ Play';
  b.onclick=async()=>{const d=await api(`/api/libplay?tid=${t.id}&fid=${f.id}`);d.status=='ok'?showPlayer(d.url,f.name):alert(d.detail)};r.append(b);$('#srv').append(r)})}
home();
</script></body></html>
