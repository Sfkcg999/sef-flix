<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#0b0b0b"><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<title>SEF-FLIX</title>
<link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel=stylesheet>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0b0b0b;color:#fff;font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px 16px;min-height:100dvh;
 background:radial-gradient(1200px 600px at 50% -10%,rgba(229,9,20,.28),transparent 60%),radial-gradient(800px 500px at 100% 110%,rgba(229,9,20,.12),transparent 60%),#0b0b0b}
main{width:100%;max-width:400px}
.logo{font-family:"Bebas Neue",Impact,sans-serif;color:#e50914;font-size:56px;letter-spacing:2px;line-height:1;text-align:center;margin:0 0 28px;text-shadow:0 4px 24px rgba(229,9,20,.35)}
form{background:rgba(20,20,20,.82);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:32px 28px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{font-size:22px;font-weight:700;margin:0 0 20px;text-align:center}
input{width:100%;font:inherit;font-size:16px;color:#fff;background:#262626;border:1px solid #3a3a3a;border-radius:10px;padding:14px 16px;outline:none;transition:border-color .15s}
input:focus{border-color:#e50914}
button{width:100%;margin-top:16px;font:inherit;font-size:16px;font-weight:600;color:#fff;background:#e50914;border:0;border-radius:10px;padding:14px;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:#f6121d}button:active{transform:scale(.98)}
.err{margin:0 0 16px;padding:10px 14px;border-radius:10px;background:rgba(232,124,3,.12);color:#ffb35c;font-size:14px;text-align:center}
</style></head><body><main>
<div class=logo>SEF-FLIX</div>
<form method=post action=/login>
<h1>Log in with TorBox API key</h1>
<!--ERR-->
<input type=password name=k placeholder="TorBox API key" aria-label="TorBox API key" autocomplete=current-password autocapitalize=off spellcheck=false required autofocus>
<button>Log in</button>
</form></main></body></html>
